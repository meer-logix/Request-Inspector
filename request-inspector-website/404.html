<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Request Not Found | WordPress Request Inspector</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="hero" style="min-height:100vh;display:flex;align-items:center;padding:60px 0;">
  <div class="container text-center" style="position:relative;z-index:1;">
    <img src="assets/img/logo.png" alt="" width="72" height="72" style="margin:0 auto 24px;">
    <div class="req-row" style="display:inline-grid;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);max-width:420px;margin:0 auto 24px;">
      <span class="method get">GET</span><span class="req-url">{{ requested_page }}</span><span class="status s5">404</span>
    </div>
    <h1 style="color:#fff;">This route isn't registered.</h1>
    <p class="lead" style="margin:14px auto 30px;">Whatever you were looking for didn't return a 200. Let's get you back to a known route.</p>
    <div class="hero-actions" style="justify-content:center;">
      <a href="index.html" class="btn btn-primary">Back to home</a>
      <a href="docs.html" class="btn btn-on-dark">Browse the docs</a>
    </div>
  </div>
</div>
</body>
</html>
